spring.application.name=taskbridge-api

# Server Port
server.port=8080

# --- Database Configuration ---

# H2 Database (Default for Assessment/Demo Purposes)
# H2 is used as the default runtime database to allow evaluators to run the application immediately
# without requiring a local PostgreSQL installation. This improves portability and simplifies setup.
spring.datasource.url=jdbc:h2:mem:taskbridge_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Console
# The H2 console is enabled for easier database inspection during assessment/demo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL Database (Production Target)
# PostgreSQL remains the intended production database for the application.
# Replace the H2 configuration with the following settings for production:
# spring.datasource.url=jdbc:postgresql://localhost:5432/taskbridge_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA Configuration ---
# JPA settings for schema generation and SQL logging
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true